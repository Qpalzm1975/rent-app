# Verifies every push to a working branch (claude/**). First it brings
# pnpm-lock.yaml up to date with the pinned pnpm (a no-op unless package.json or
# pnpm-workspace.yaml changed) and commits it to the branch; then it runs the
# full CI against the resulting commit. Commits pushed with GITHUB_TOKEN do not
# trigger other workflows, so CI is called directly. main is verified by ci.yml.
name: Branch checks
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
concurrency:
  group: branch-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lockfile:
    name: Refresh lockfile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # setup-node v5 otherwise tries to cache pnpm's store (named by the
          # "packageManager" field) before pnpm is installed, and fails.
          package-manager-cache: false
      - name: Install pnpm 11.25.0
        run: npm install --global pnpm@11.25.0
      - name: Resolve dependencies into pnpm-lock.yaml
        run: bash .github/scripts/step.sh lockfile pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit the refreshed lockfile
        id: commit
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Refresh pnpm-lock.yaml for updated dependencies"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    name: CI
    needs: lockfile
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.lockfile.outputs.sha }}
